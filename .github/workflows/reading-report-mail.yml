name: reading-report-mail

on:
  schedule:
    - cron: "0 23 * * *"  # JST 毎日 08:00 (UTC 23:00)
  workflow_dispatch:
    inputs:
      date:
        description: '基準日 (形式: YYYY-MM-DD、例: 2026-08-09)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      B2_ACCESS_KEY_ID: "dummy"
      B2_SECRET_ACCESS_KEY: "dummy"
      B2_REGION: "dummy"
      B2_BUCKET: "dummy"
      B2_ENDPOINT: "https://dummy.example.com"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run reading report dispatch task
        env:
          DATE: ${{ github.event.inputs.date }}
        run: bundle exec rake reading_reports:dispatch