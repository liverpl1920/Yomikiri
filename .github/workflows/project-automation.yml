name: Project Automation

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [closed]

jobs:
  # ─────────────────────────────────────────
  # Issue/PR がプロジェクトに未登録の場合に自動追加
  # ─────────────────────────────────────────
  add_to_project:
    name: Add to GitHub Project
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' || github.event.action == 'reopened'

    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/liverpl1920/projects/2
          github-token: ${{ secrets.PROJECT_TOKEN }}

  # ─────────────────────────────────────────
  # PR マージ時: linked issue を "Done" へ移動
  # ─────────────────────────────────────────
  move_to_done:
    name: Move linked issue to Done on PR merge
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true

    steps:
      - name: Parse linked issue number from PR body
        id: parse
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          ISSUE=$(echo "$BODY" | grep -oP '(?<=(Closes|Fixes|Resolves|Fix|Close|Resolve) #)\d+' | head -1)
          echo "issue_number=$ISSUE" >> $GITHUB_OUTPUT

      - name: Move linked issue to Done in GitHub Project
        if: steps.parse.outputs.issue_number != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            const projectId   = 'PVT_kwHOA7Zdn84BP4zg';
            const statusFieldId  = 'PVTSSF_lAHOA7Zdn84BP4zgzg-Kmmw';
            const doneOptionId   = 'cdb8da9c';

            // 1. Issue の projectItems を取得
            const issueResult = await github.graphql(`
              query($owner: String!, $repo: String!, $issueNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issueNumber) {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issueNumber
            });

            const items = issueResult.repository.issue?.projectItems?.nodes ?? [];
            const item  = items.find(n => n.project.id === projectId);

            if (!item) {
              console.log(`Issue #${issueNumber} is not in project. Skipping.`);
              return;
            }

            // 2. Status を "Done" へ更新
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId:    $itemId
                  fieldId:   $fieldId
                  value:     { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `, {
              projectId,
              itemId:   item.id,
              fieldId:  statusFieldId,
              optionId: doneOptionId
            });

            console.log(`Moved issue #${issueNumber} to Done.`);

